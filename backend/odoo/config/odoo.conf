[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
db_host = db
db_port = 5432
db_user = odoo
; db_password se inyecta por variable de entorno PASSWORD en docker-compose
db_name = uva
dbfilter = ^uva$
list_db = False
proxy_mode = True
workers = 2
max_cron_threads = 1
limit_time_cpu = 120
limit_time_real = 240
log_level = info
; Contraseña maestra del gestor de bases de datos: CÁMBIALA en producción
admin_passwd = cambia-esta-clave-maestra
