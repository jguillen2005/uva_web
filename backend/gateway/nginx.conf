# API Gateway del Sistema UVA: enruta /api/<dominio>/* al microservicio correspondiente.
# El prefijo /api/<dominio> se elimina antes de reenviar (el servicio ve /tablero, /clientes, ...).
# Se usa el DNS interno de Docker con TTL corto: si un microservicio se recrea y cambia de IP,
# el gateway lo vuelve a encontrar sin reiniciarse.


map $http_origin $cors_origin {
    default "";
    "~^https?://(localhost|127\.0\.0\.1)(:\d+)?$" $http_origin;
    # Agrega aquí el dominio productivo del frontend, p.ej.:
    # "https://uva.midominio.mx" $http_origin;
}

server {
    listen 8080;
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Identidad del usuario final: solo la fijará el SSO; nunca se acepta desde el cliente.
    proxy_set_header X-UVA-User "";
    proxy_read_timeout 60s;

    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    if ($request_method = OPTIONS) { return 204; }

    location = /api/health {
        default_type application/json;
        return 200 '{"service":"gateway","status":"ok"}';
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    # App de campo (App Asercontrol): endpoints servidos directo por Odoo (módulo uva_app_movil).
    # Solo se publica /api/app/*; el backoffice de Odoo sigue interno. Las actas viajan con fotos y PDF.
    location /api/app/ {
        client_max_body_size 80m;
        proxy_read_timeout 180s;
        set $odoo_upstream odoo:8069;
        proxy_pass http://$odoo_upstream;
    }

    # Inicio de sesión de la web (módulo uva_sesion_web en Odoo): login, recuperar contraseña, salir, yo.
    location /api/sesion/ {
        set $odoo_upstream odoo:8069;
        proxy_pass http://$odoo_upstream;
    }

    # Validación de la sesión para auth_request: solo uso interno del gateway.
    location = /_sesion {
        internal;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        set $odoo_upstream odoo:8069;
        proxy_pass http://$odoo_upstream/api/sesion/validar;
    }

    # API de la web: exige una sesión válida y reenvía a los microservicios el usuario real.
    # (Un proxy_set_header aquí anula los del bloque server: se repiten los necesarios.)
    location ~ ^/api/(reportes|catalogos|solicitudes|operacion|calidad|dictaminacion)(/.*)?$ {
        auth_request /_sesion;
        auth_request_set $uva_login $upstream_http_x_uva_login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-UVA-User $uva_login;
        set $svc_host svc-$1;
        set $svc_path $2;
        if ($svc_path = "") { set $svc_path /; }
        proxy_pass http://$svc_host:4000$svc_path$is_args$args;
    }
    error_page 401 = @sin_sesion;
    location @sin_sesion {
        default_type application/json;
        return 401 '{"error":"Su sesión venció o no es válida. Inicie sesión nuevamente."}';
    }
    # Contraseña inicial o temporal: /api/sesion/validar responde 403 hasta que el usuario cree una nueva
    error_page 403 = @cambiar_clave;
    location @cambiar_clave {
        default_type application/json;
        return 403 '{"error":"Antes de continuar, cree su contraseña nueva.","cambiarClave":true}';
    }

    # Página de Odoo para restablecer la contraseña (enlace del correo de «¿Olvidó su contraseña?»).
    location = /web/reset_password {
        set $odoo_upstream odoo:8069;
        proxy_pass http://$odoo_upstream;
    }

    location /api/ {
        default_type application/json;
        return 404 '{"error":"Servicio no encontrado"}';
    }

    # Páginas públicas del sitio web de Odoo (módulo uva_legal) y los recursos que necesitan.
    # Solo se exponen estas rutas: el backoffice de Odoo (/web, /odoo, /web/login) sigue interno.
    location ~ ^/((aviso-de-privacidad|terminos-y-condiciones)/?|website/translations)$ {
        set $odoo_upstream odoo:8069;
        proxy_pass http://$odoo_upstream;
    }
    location ~ ^/(web/assets|web/image|web/static|[a-z_]+/static)/ {
        set $odoo_upstream odoo:8069;
        proxy_pass http://$odoo_upstream;
        expires 7d;
    }

    # Descargas públicas para instalar la app de campo (certificado de la CA, perfil de iOS, APK y
    # direcciones). Solo contienen datos públicos; ^~ evita que las reglas de Odoo de arriba las tomen.
    location ^~ /descargas/ {
        alias /usr/share/nginx/descargas/;
        types {
            application/x-x509-ca-cert crt;
            application/x-apple-aspen-config mobileconfig;
            application/vnd.android.package-archive apk;
            application/json json;
        }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    # En producción el gateway también sirve el build del frontend (dist/).
    # La página principal no se guarda en caché (así cada actualización se ve de inmediato); los archivos de
    # assets/ llevan su versión en el nombre y sí se guardan. Un add_header en el location anula los del
    # servidor: por eso se repiten los de seguridad.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
