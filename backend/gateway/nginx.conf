# API Gateway del Sistema UVA: enruta /api/<dominio>/* al microservicio correspondiente.
# El prefijo /api/<dominio> se elimina antes de reenviar (el servicio ve /tablero, /clientes, ...).
# Se usa el DNS interno de Docker con TTL corto: si un microservicio se recrea y cambia de IP,
# el gateway lo vuelve a encontrar sin reiniciarse.


map $http_origin $cors_origin {
    default "";
    "~^https?://(localhost|127\.0\.0\.1)(:\d+)?$" $http_origin;
    # Agrega aquí el dominio productivo del frontend, p.ej.:
    # "https://uva.midominio.mx" $http_origin;
}

server {
    listen 8080;
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Identidad del usuario final: solo la fijará el SSO; nunca se acepta desde el cliente.
    proxy_set_header X-UVA-User "";
    proxy_read_timeout 60s;

    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    add_header X-Content-Type-Options nosniff always;

    if ($request_method = OPTIONS) { return 204; }

    location = /api/health {
        default_type application/json;
        return 200 '{"service":"gateway","status":"ok"}';
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/api/(reportes|catalogos|solicitudes|operacion|calidad|dictaminacion)(/.*)?$ {
        set $svc_host svc-$1;
        set $svc_path $2;
        if ($svc_path = "") { set $svc_path /; }
        proxy_pass http://$svc_host:4000$svc_path$is_args$args;
    }

    location /api/ {
        default_type application/json;
        return 404 '{"error":"Servicio no encontrado"}';
    }

    # Páginas públicas del sitio web de Odoo (módulo uva_legal) y los recursos que necesitan.
    # Solo se exponen estas rutas: el backoffice de Odoo (/web, /odoo, /web/login) sigue interno.
    location ~ ^/((aviso-de-privacidad|terminos-y-condiciones)/?|website/translations)$ {
        set $odoo_upstream odoo:8069;
        proxy_pass http://$odoo_upstream;
    }
    location ~ ^/(web/assets|web/image|web/static|[a-z_]+/static)/ {
        set $odoo_upstream odoo:8069;
        proxy_pass http://$odoo_upstream;
        expires 7d;
    }

    # En producción el gateway también sirve el build del frontend (dist/)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
