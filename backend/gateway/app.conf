# App de campo Asercontrol (PWA para tablets), servida por HTTPS en su propio puerto.
# HTTPS es obligatorio en las tablets: sin él el navegador no permite GPS ni el trabajo sin conexión.
# La app y su API comparten origen (/api/app → Odoo, módulo uva_app_movil), así que no requiere CORS.
# Lo activa docker-compose.app.yml; los certificados los genera el instalador en backend/certs.

# El APK de Android (Capacitor) carga la app desde https://localhost y llama a esta API: único origen
# externo permitido.
map $http_origin $app_cors_origin {
    default "";
    "https://localhost" $http_origin;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/servidor-cadena.crt;
    ssl_certificate_key /etc/nginx/certs/servidor.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Quien entre por http:// a este puerto se redirige a https://
    error_page 497 =301 https://$host:$server_port$request_uri;

    # Encabezados de seguridad. Ojo: un add_header dentro de un location anula estos; por eso se repiten abajo.
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options SAMEORIGIN always;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/app/ {
        add_header Access-Control-Allow-Origin $app_cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Accept" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        if ($request_method = OPTIONS) { return 204; }
        client_max_body_size 80m;
        proxy_read_timeout 180s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-UVA-User "";
        set $odoo_upstream odoo:8069;
        proxy_pass http://$odoo_upstream;
    }

    location /api/ {
        default_type application/json;
        return 404 '{"error":"Servicio no encontrado"}';
    }

    root /usr/share/nginx/app;

    # El service worker y la página principal no se guardan en caché: así las tablets reciben cada versión nueva.
    location = /sw.js { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; add_header Strict-Transport-Security "max-age=31536000" always; add_header X-Frame-Options SAMEORIGIN always; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; add_header Strict-Transport-Security "max-age=31536000" always; add_header X-Frame-Options SAMEORIGIN always; }
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff always; add_header Strict-Transport-Security "max-age=31536000" always; add_header X-Frame-Options SAMEORIGIN always; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
